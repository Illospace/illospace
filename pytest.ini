[pytest]
testpaths = tests meetbot/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
timeout = 120
markers =
    integration: marks tests requiring a live database (deselect with '-m "not integration"')
    requires_db: marks tests needing Docker test DB (deselect with '-m "not requires_db"')
    requires_browser: marks tests needing a real Browser Harness + Chrome runtime
    live_provider: marks optional evals that require live model/provider credentials
