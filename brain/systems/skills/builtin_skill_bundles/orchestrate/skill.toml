schema_version = 1
name = "orchestrate"
display_name = "Orchestrate"
version = "2.0.0"
description = "Delegate independent deliverables with spawn_worker, collect every child result honestly, and verify the final outcome."
license = "Apache-2.0"
source = "illo-core"
visibility = "public"

[routing]
triggers = [
  { pattern = "spawn_worker", direction = "for" },
  { pattern = "multiple deliverables", direction = "for" },
  { pattern = "parallel workers", direction = "for" },
  { pattern = "fan out workers", direction = "for" },
  { pattern = "worker handoff", direction = "for" },
  { pattern = "independent worker scopes", direction = "for" },
  { pattern = "one focused action", direction = "against" },
  { pattern = "direct answer", direction = "against" },
  { pattern = "one focused debugging loop", direction = "against" },
]

[runtime]
default_thinking_tier = "medium"

[permissions]
toolsets = ["brain"]

[loading]
summary = "SKILL.md#role"
procedure = "SKILL.md"
examples = "examples/"
templates = "templates/"
schemas = "schemas/"
evals = "evals/"
references = "references/"

[assets]
asset_1 = "evals/routing.jsonl"
asset_2 = "references/failure-handling.md"
asset_3 = "schemas/orchestration-plan.schema.json"
asset_4 = "templates/worker-assignment.md"
