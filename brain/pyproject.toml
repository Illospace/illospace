[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "illo-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.180",
  "fastapi>=0.115,<1", "uvicorn>=0.31,<1", "httpx>=0.27,<1",
  "mcp>=1.26,<2", "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.setuptools]
packages = ["brain", "brain.runtimes"]
package-dir = {brain = "."}
