<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Illo mascot light preview</title>
  <desc id="desc">Polished SVG preview of the light Illo mascot on a dark Constellation background.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#173052" stop-opacity="0.42" />
      <stop offset="48%" stop-color="#08111f" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#03070d" />
    </radialGradient>
    <radialGradient id="bodyGlow" cx="222" cy="145" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffaf1" />
      <stop offset="44%" stop-color="#f0e7d9" />
      <stop offset="78%" stop-color="#cfc3b5" />
      <stop offset="100%" stop-color="#b6a895" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5d8" />
      <stop offset="14%" stop-color="#07111d" />
      <stop offset="66%" stop-color="#04101d" />
      <stop offset="100%" stop-color="#0b5aa8" />
    </radialGradient>
    <linearGradient id="ringWarm" x1="62" y1="360" x2="448" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2c9" />
      <stop offset="40%" stop-color="#8db7ff" />
      <stop offset="100%" stop-color="#e9d3ad" />
    </linearGradient>
    <filter id="softBlueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.24 0 0 0 0 0.56 0 0 0 0 1 0 0 0 0.8 0" result="blue" />
      <feMerge>
        <feMergeNode in="blue" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect id="background" width="512" height="512" fill="url(#bgGlow)" />
  <g id="background_stars" opacity="0.6">
    <circle cx="82" cy="86" r="1.1" fill="#8db7ff" opacity="0.55" />
    <circle cx="126" cy="411" r="1.4" fill="#fffaf1" opacity="0.42" />
    <circle cx="385" cy="98" r="1.2" fill="#8db7ff" opacity="0.5" />
    <circle cx="436" cy="340" r="1.4" fill="#fffaf1" opacity="0.35" />
    <path d="M66 187 C177 116 336 93 454 142" style="fill:none" stroke="#8db7ff" stroke-width="1" opacity="0.12" />
    <path d="M43 380 C177 444 330 429 463 339" style="fill:none" stroke="#e9d3ad" stroke-width="1" opacity="0.12" />
  </g>

  <ellipse id="ground_shadow" cx="260" cy="421" rx="129" ry="20" fill="#00050c" opacity="0.42" />

  <g id="illo_mascot_light_preview">
    <g id="orbit_back" data-pivot-x="256" data-pivot-y="266" filter="url(#softBlueGlow)">
      <path d="M70 326 C132 235 336 146 425 180 C491 205 414 314 286 371 C166 424 56 391 70 326" style="fill:none" stroke="url(#ringWarm)" stroke-width="7" stroke-linecap="round" opacity="0.78" />
      <path d="M70 326 C132 235 336 146 425 180 C491 205 414 314 286 371 C166 424 56 391 70 326" style="fill:none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.58" />
    </g>

    <g id="feet" data-pivot-x="256" data-pivot-y="365">
      <ellipse cx="215" cy="369" rx="28" ry="35" fill="#d8cfc2" stroke="#fffaf1" stroke-width="1" opacity="0.95" />
      <ellipse cx="256" cy="374" rx="27" ry="34" fill="#e5dbcd" stroke="#fffaf1" stroke-width="1" opacity="0.95" />
      <ellipse cx="297" cy="369" rx="28" ry="35" fill="#d8cfc2" stroke="#fffaf1" stroke-width="1" opacity="0.95" />
    </g>

    <g id="body" data-pivot-x="260" data-pivot-y="245">
      <path d="M260 70 C234 102 198 134 185 191 C169 263 192 327 246 350 C306 376 357 326 350 252 C344 190 313 153 286 128 C273 116 272 96 286 82 C298 71 289 60 260 70 Z" fill="#f0e7d9" stroke="#fffaf1" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M224 123 C198 159 185 205 186 244 C187 300 216 332 250 344 C207 315 196 256 209 202 C218 164 240 137 262 112 C247 114 235 117 224 123 Z" fill="#fff7ec" opacity="0.36" />
      <path d="M310 141 C337 179 351 218 348 258 C343 329 296 371 246 350 C297 345 323 309 321 256 C320 207 298 171 273 137 C287 145 299 145 310 141 Z" fill="#8a7d70" opacity="0.16" />
      <path d="M178 246 C187 185 232 155 279 166 C333 179 356 229 340 278 C324 327 276 348 229 333 C188 320 172 286 178 246 Z" fill="#f0e7d9" fill-opacity="0" stroke="#8a7d70" stroke-width="2" stroke-opacity="0.28" />
    </g>

    <g id="body_speckles" opacity="0.8">
      <circle cx="230" cy="130" r="2.2" fill="#ffffff" />
      <circle cx="274" cy="122" r="1.6" fill="#8db7ff" />
      <circle cx="304" cy="166" r="1.8" fill="#ffffff" />
      <circle cx="220" cy="192" r="1.6" fill="#8db7ff" />
      <circle cx="278" cy="206" r="2.1" fill="#ffffff" />
      <circle cx="320" cy="235" r="1.5" fill="#8db7ff" />
      <circle cx="207" cy="269" r="1.7" fill="#ffffff" />
      <circle cx="289" cy="287" r="1.4" fill="#8db7ff" />
      <circle cx="244" cy="312" r="1.9" fill="#ffffff" />
      <circle cx="333" cy="301" r="1.5" fill="#ffffff" />
      <circle cx="259" cy="154" r="1.2" fill="#8db7ff" />
      <circle cx="191" cy="225" r="1.3" fill="#ffffff" />
    </g>

    <g id="eyes" data-pivot-x="256" data-pivot-y="244">
      <g id="eye_left" data-pivot-x="218" data-pivot-y="244">
        <ellipse cx="218" cy="244" rx="21" ry="27" fill="url(#eyeGlow)" />
        <ellipse cx="221" cy="254" rx="13" ry="12" fill="#0d69c8" opacity="0.68" />
        <circle cx="210" cy="232" r="5" fill="#fff0ce" />
        <circle cx="226" cy="235" r="2.5" fill="#dceaff" />
      </g>
      <g id="eye_right" data-pivot-x="294" data-pivot-y="244">
        <ellipse cx="294" cy="244" rx="21" ry="27" fill="url(#eyeGlow)" />
        <ellipse cx="297" cy="254" rx="13" ry="12" fill="#0d69c8" opacity="0.68" />
        <circle cx="286" cy="232" r="5" fill="#fff0ce" />
        <circle cx="302" cy="235" r="2.5" fill="#dceaff" />
      </g>
    </g>

    <g id="orbit_front" data-pivot-x="256" data-pivot-y="266" filter="url(#softBlueGlow)">
      <path d="M73 337 C160 307 287 260 423 185" style="fill:none" stroke="url(#ringWarm)" stroke-width="7" stroke-linecap="round" opacity="0.96" />
      <path d="M73 337 C160 307 287 260 423 185" style="fill:none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.68" />
      <path d="M239 360 C272 356 286 389 262 413 C246 428 216 413 226 389 C230 378 235 368 239 360" style="fill:none" stroke="url(#ringWarm)" stroke-width="6" stroke-linecap="round" opacity="0.92" />
      <path d="M239 360 C272 356 286 389 262 413 C246 428 216 413 226 389 C230 378 235 368 239 360" style="fill:none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.62" />
    </g>

    <g id="signal_nodes" filter="url(#softBlueGlow)">
      <g id="node_left" data-pivot-x="73" data-pivot-y="337">
        <circle cx="73" cy="337" r="13" fill="#2e8dff" opacity="0.32" />
        <circle cx="73" cy="337" r="7" fill="#48a1ff" stroke="#cfe5ff" stroke-width="2" />
        <circle cx="70" cy="334" r="2" fill="#ffffff" />
      </g>
      <g id="node_top" data-pivot-x="423" data-pivot-y="185">
        <circle cx="423" cy="185" r="13" fill="#2e8dff" opacity="0.32" />
        <circle cx="423" cy="185" r="7" fill="#48a1ff" stroke="#cfe5ff" stroke-width="2" />
        <circle cx="420" cy="182" r="2" fill="#ffffff" />
      </g>
      <g id="node_lower" data-pivot-x="262" data-pivot-y="413">
        <circle cx="262" cy="413" r="10" fill="#2e8dff" opacity="0.26" />
        <circle cx="262" cy="413" r="5.5" fill="#48a1ff" stroke="#cfe5ff" stroke-width="1.5" />
      </g>
    </g>
  </g>
</svg>
