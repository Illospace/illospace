<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
  <title id="title">Illo inbound signal triage architecture</title>
  <desc id="desc">A diagram showing external tools sending signals into deterministic Illo ingress, then an Illo LLM triage layer deciding the destination and action, then deterministic execution of workspace updates.</desc>
  <defs>
    <style>
      .bg { fill: #f6f3ec; }
      .panel { fill: #ffffff; stroke: #d7cfc2; stroke-width: 2; }
      .panel-det { fill: #eff7f5; stroke: #7fa89e; stroke-width: 2.5; }
      .panel-agent { fill: #f5f0fa; stroke: #9a80b9; stroke-width: 2.5; }
      .panel-action { fill: #fff4df; stroke: #bf8f2f; stroke-width: 2.5; }
      .box { fill: #ffffff; stroke: #b8aa96; stroke-width: 2; }
      .box-source { fill: #edf3fb; stroke: #83a1c9; }
      .box-det { fill: #ffffff; stroke: #7fa89e; }
      .box-agent { fill: #ffffff; stroke: #9a80b9; }
      .box-action { fill: #ffffff; stroke: #bf8f2f; }
      .box-muted { fill: #f9f7f2; stroke: #cfc5b7; }
      .title { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #231f19; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f564b; }
      .panel-title { font: 800 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #27231d; }
      .panel-note { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5e554a; }
      .label { font: 750 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b261f; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #62594e; }
      .tiny { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6f665b; }
      .badge-det { fill: #dff0ec; stroke: #7fa89e; stroke-width: 1.5; }
      .badge-agent { fill: #ebe0f5; stroke: #9a80b9; stroke-width: 1.5; }
      .badge-action { fill: #ffe8ba; stroke: #bf8f2f; stroke-width: 1.5; }
      .badge-text { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #332d25; letter-spacing: .7px; }
      .arrow { fill: none; stroke: #6f665b; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #9b8f81; stroke-width: 2.5; marker-end: url(#arrow-soft); }
      .boundary { stroke: #c9bdae; stroke-width: 2; stroke-dasharray: 10 10; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#6f665b" />
    </marker>
    <marker id="arrow-soft" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#9b8f81" />
    </marker>
  </defs>

  <rect class="bg" width="1700" height="1040" />

  <text x="70" y="72" class="title">Illo Inbound Signal Triage</text>
  <text x="70" y="106" class="subtitle">Anything outside Illo sends a signal. Deterministic code makes it safe and consistent. Illo's agent decides where it belongs and what to do.</text>

  <rect x="70" y="130" width="260" height="54" rx="16" class="badge-det" />
  <text x="96" y="164" class="badge-text">DETERMINISTIC CODE</text>
  <text x="350" y="164" class="small">predictable backend logic, no LLM judgment</text>

  <rect x="640" y="130" width="220" height="54" rx="16" class="badge-agent" />
  <text x="675" y="164" class="badge-text">ILLO TRIAGE AGENT</text>
  <text x="882" y="164" class="small">LLM decides meaning, destination, visibility, and next action</text>

  <rect x="1270" y="130" width="260" height="54" rx="16" class="badge-action" />
  <text x="1302" y="164" class="badge-text">ILLO WORKSPACE ACTION</text>
  <text x="1548" y="164" class="small">the chosen update is applied</text>

  <rect x="60" y="220" width="250" height="650" rx="20" class="panel" />
  <text x="94" y="264" class="panel-title">External Tools</text>
  <text x="94" y="292" class="panel-note">They do not choose the final Illo destination.</text>

  <rect x="94" y="330" width="182" height="72" rx="10" class="box box-source" />
  <text x="120" y="360" class="label">Coding</text>
  <text x="119" y="383" class="small">Codex, Claude Code</text>

  <rect x="94" y="430" width="182" height="72" rx="10" class="box box-source" />
  <text x="120" y="460" class="label">Design</text>
  <text x="119" y="483" class="small">Figma, design tools</text>

  <rect x="94" y="530" width="182" height="72" rx="10" class="box box-source" />
  <text x="120" y="560" class="label">Project</text>
  <text x="119" y="583" class="small">Jira, Linear, Asana</text>

  <rect x="94" y="630" width="182" height="72" rx="10" class="box box-source" />
  <text x="120" y="660" class="label">Code hosts</text>
  <text x="119" y="683" class="small">GitHub, GitLab</text>

  <rect x="94" y="730" width="182" height="72" rx="10" class="box box-source" />
  <text x="120" y="760" class="label">Custom</text>
  <text x="119" y="783" class="small">scripts, email, forms</text>

  <rect x="360" y="220" width="480" height="650" rx="20" class="panel-det" />
  <text x="400" y="264" class="panel-title">Deterministic Ingress + Signal Prep</text>
  <text x="400" y="292" class="panel-note">Ingress means the entry door into Illo: MCP tool, webhook, or REST API.</text>

  <rect x="398" y="330" width="185" height="86" rx="12" class="box box-det" />
  <text x="432" y="362" class="label">Ingress adapter</text>
  <text x="425" y="387" class="small">MCP / webhook / API</text>

  <rect x="618" y="330" width="185" height="86" rx="12" class="box box-det" />
  <text x="652" y="362" class="label">Auth + scope</text>
  <text x="655" y="387" class="small">source permissions</text>

  <rect x="398" y="465" width="185" height="96" rx="12" class="box box-det" />
  <text x="432" y="497" class="label">Store raw</text>
  <text x="418" y="522" class="small">audit, retry, replay</text>
  <text x="434" y="543" class="small">idempotency key</text>

  <rect x="618" y="465" width="185" height="96" rx="12" class="box box-det" />
  <text x="652" y="497" class="label">Normalize</text>
  <text x="646" y="522" class="small">InboundSignal</text>
  <text x="644" y="543" class="small">source, actor, text</text>

  <rect x="398" y="615" width="405" height="100" rx="12" class="box box-det" />
  <text x="438" y="648" class="label">Cheap deterministic hints</text>
  <text x="438" y="674" class="small">exact idea/thread IDs, URLs, repo names, ticket keys, project resources</text>
  <text x="438" y="697" class="small">These are hints, not the final routing authority.</text>

  <rect x="398" y="748" width="405" height="68" rx="12" class="box box-muted" />
  <text x="438" y="777" class="label">Output</text>
  <text x="438" y="801" class="small">one clean signal object + source policy + candidate matches</text>

  <rect x="900" y="220" width="360" height="650" rx="20" class="panel-agent" />
  <text x="940" y="264" class="panel-title">Illo Triage Agent</text>
  <text x="940" y="292" class="panel-note">Yes: this is where the LLM decides.</text>

  <rect x="940" y="330" width="280" height="88" rx="12" class="box box-agent" />
  <text x="982" y="362" class="label">Read context</text>
  <text x="973" y="387" class="small">signal, source policy, workspace memory</text>

  <rect x="940" y="465" width="280" height="110" rx="12" class="box box-agent" />
  <text x="983" y="498" class="label">Understand signal</text>
  <text x="967" y="524" class="small">what happened, why it matters</text>
  <text x="976" y="546" class="small">who should know about it</text>

  <rect x="940" y="625" width="280" height="126" rx="12" class="box box-agent" />
  <text x="986" y="658" class="label">Choose decision</text>
  <text x="970" y="684" class="small">thread vs idea vs pin vs project</text>
  <text x="972" y="706" class="small">post, create, link, ask human</text>
  <text x="992" y="728" class="small">or trigger an Illo run</text>

  <rect x="1320" y="220" width="320" height="650" rx="20" class="panel-action" />
  <text x="1360" y="264" class="panel-title">Illo Workspace Actions</text>
  <text x="1360" y="292" class="panel-note">The executor applies the agent's decision deterministically.</text>

  <rect x="1360" y="330" width="240" height="70" rx="12" class="box box-action" />
  <text x="1392" y="359" class="label">Post to thread</text>
  <text x="1392" y="382" class="small">progress update or journal entry</text>

  <rect x="1360" y="430" width="240" height="70" rx="12" class="box box-action" />
  <text x="1392" y="459" class="label">Create idea/thread</text>
  <text x="1392" y="482" class="small">when no good home exists</text>

  <rect x="1360" y="530" width="240" height="70" rx="12" class="box box-action" />
  <text x="1392" y="559" class="label">Link context</text>
  <text x="1392" y="582" class="small">pin, project, source object</text>

  <rect x="1360" y="630" width="240" height="70" rx="12" class="box box-action" />
  <text x="1392" y="659" class="label">Ask human</text>
  <text x="1392" y="682" class="small">low confidence or sensitive action</text>

  <rect x="1360" y="730" width="240" height="70" rx="12" class="box box-action" />
  <text x="1392" y="759" class="label">Trigger Illo run</text>
  <text x="1392" y="782" class="small">only when an agent should act</text>

  <line x1="870" y1="220" x2="870" y2="870" class="boundary" />
  <line x1="1290" y1="220" x2="1290" y2="870" class="boundary" />

  <path class="arrow" d="M276 366 C315 366 345 373 396 373" />
  <path class="arrow" d="M276 466 C315 466 345 373 396 373" />
  <path class="arrow" d="M276 566 C315 566 345 373 396 373" />
  <path class="arrow" d="M276 666 C315 666 345 373 396 373" />
  <path class="arrow" d="M276 766 C315 766 345 373 396 373" />

  <path class="arrow" d="M583 373 L616 373" />
  <path class="arrow" d="M710 416 L710 463" />
  <path class="arrow" d="M618 513 L585 513" />
  <path class="arrow" d="M490 561 L490 613" />
  <path class="arrow" d="M600 715 L600 746" />
  <path class="arrow" d="M803 782 C850 782 885 374 938 374" />

  <path class="arrow" d="M1080 418 L1080 463" />
  <path class="arrow" d="M1080 575 L1080 623" />
  <path class="arrow" d="M1220 688 C1260 688 1300 365 1358 365" />
  <path class="arrow-soft" d="M1220 688 C1260 688 1300 465 1358 465" />
  <path class="arrow-soft" d="M1220 688 C1260 688 1300 565 1358 565" />
  <path class="arrow-soft" d="M1220 688 C1260 688 1300 665 1358 665" />
  <path class="arrow-soft" d="M1220 688 C1260 688 1300 765 1358 765" />

  <rect x="145" y="915" width="1410" height="72" rx="18" class="panel" />
  <text x="184" y="946" class="label">Rule of thumb</text>
  <text x="350" y="946" class="small">External tools submit signals and optional hints. Illo triage decides. Deterministic code records, normalizes, dedupes, and executes the chosen action.</text>
  <text x="350" y="970" class="small">This keeps Codex, Figma, Jira, GitHub, and future tools on the same inbound pipeline.</text>
</svg>
