# data_path = "~/.t3"  # Optional read-only SQLite fallback.
# environment_id = "acme-environment"  # Optional cross-device thread links.

# Omit this table to report all projects. Use T3 project IDs as the keys.
[projects]
acme-project = "acme/app"
