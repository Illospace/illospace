mcp_url = "https://illo.example.com/mcp"
token_file = "~/.config/illo/token"
t3_url = "http://127.0.0.1:3773"
t3_token_file = "~/.config/illo/t3-token"
machine = "acme-laptop"
poll_seconds = 30
state_file = "~/.local/state/illo/t3.json"
