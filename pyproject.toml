[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "illo"
version = "0.1.0"
description = "One assistant for a whole team"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi", "uvicorn", "psycopg[binary,pool]>=3.2", "pydantic>=2,<3",
  "pyyaml", "httpx", "slack_sdk", "aiohttp", "mcp>=1.20,<2", "cryptography", "croniter", "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[project.scripts]
illo = "illo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["illo", "collectors"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"ops/external_deadman/*.py" = ["I001", "UP017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
