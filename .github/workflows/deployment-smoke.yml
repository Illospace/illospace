name: Deployment Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - "requirements.txt"
      - "requirements-production.txt"
      - "requirements-gpu.txt"
      - "pyproject.toml"
      - "alembic.ini"
      - "brain/platform/db/**"
      - "brain/app/api/main.py"
      - "brain/app/api/config.py"
      - "brain/app/api/deps.py"
      - ".github/workflows/deployment-smoke.yml"
  workflow_dispatch:

concurrency:
  group: deployment-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Compose smoke test
        run: deploy/scripts/smoke-test.sh --build
