name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: illo
          POSTGRES_PASSWORD: illo
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U illo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -e './brain[dev]'
      - run: ruff check .
      - run: pytest
