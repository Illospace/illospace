name: Brain CI

on:
  push:
    branches: [main]
  # No base-branch filter. A stacked PR is based on another feature branch, and a
  # `branches: [main]` filter gives it zero checks — silently, since an empty
  # checks list reads as "none configured" rather than "never tested" (#682).
  pull_request:
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.selected.outputs.backend }}
      frontend: ${{ steps.selected.outputs.frontend }}
      db: ${{ steps.selected.outputs.db }}

    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              # scripts/** is backend surface too: fast-suite tests read those
              # files directly (the async-DB debt gate, scripts/verify.py), so a
              # script-only change that breaks its own guard test would otherwise
              # skip the suite that guards it and only fail once it reaches main.
              - "brain/**"
              # meetbot/** is backend surface covered by the fast fake-based suite.
              - "meetbot/**"
              - "deploy/**"
              - "tests/**"
              - "scripts/**"
              - "requirements*.txt"
              - "requirements-gpu.txt"
              - "pyproject.toml"
              - "alembic.ini"
              - "docker-compose.test.yml"
              - ".github/workflows/brain-ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/brain-ci.yml"
            db:
              # Run the Postgres DB suite whenever backend code or tests change,
              # not only on DB-infra edits — otherwise the requires_db-marked
              # coverage (chat routes, cross-channel recall, notifications, etc.)
              # never runs on ordinary backend PRs. Narrow this back if Postgres
              # CI cost becomes a concern.
              - "brain/**"
              - "tests/**"
              - "brain/platform/db/**"
              - "tests/test_schema_contract.py"
              - "tests/test_db_*.py"
              - "tests/db_engine_utils.py"
              - "scripts/sync_schema.py"
              - "scripts/check_db_audit_objectives.py"
              - "scripts/async_*db*.py"
              - "alembic.ini"
              - ".github/workflows/brain-ci.yml"

      - name: Select jobs
        id: selected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "db=${{ steps.filter.outputs.db }}" >> "$GITHUB_OUTPUT"
          fi

  backend-fast:
    name: Backend fast suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Check enabled Cycle context admission
        run: python3 -m brain.jobs.check_cycle_context_admission

      - name: Run backend fast suite
        run: >-
          python3 -m pytest
          -m "not requires_db and not requires_browser and not live_provider"
          -q

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run Svelte check
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  db-contract:
    name: Backend DB suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: illo_test
          POSTGRES_USER: illo_test
          POSTGRES_PASSWORD: illo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U illo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: illo_test
      DB_USER: illo_test
      DB_PASSWORD: illo_test
      TEST_DB_URL: postgresql://illo_test:illo_test@127.0.0.1:5433/illo_test
      CI_BRAIN_DB: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run database migrations
        run: python3 -m alembic upgrade head

      - name: Run database test suite
        run: python3 -m pytest tests/ -m requires_db -v --tb=short

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-fast
      - frontend
      - db-contract
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check selected CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci_result_gate.sh
