name: Brain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.selected.outputs.backend }}
      frontend: ${{ steps.selected.outputs.frontend }}
      db: ${{ steps.selected.outputs.db }}

    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "brain/**"
              - "tests/**"
              - "requirements*.txt"
              - "requirements-gpu.txt"
              - "pyproject.toml"
              - "alembic.ini"
              - "docker-compose.test.yml"
              - ".github/workflows/brain-ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/brain-ci.yml"
            db:
              - "brain/platform/db/**"
              - "tests/test_schema_contract.py"
              - "tests/test_db_*.py"
              - "tests/db_engine_utils.py"
              - "scripts/sync_schema.py"
              - "scripts/check_db_audit_objectives.py"
              - "scripts/async_*db*.py"
              - "alembic.ini"
              - ".github/workflows/brain-ci.yml"

      - name: Select jobs
        id: selected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "db=${{ steps.filter.outputs.db }}" >> "$GITHUB_OUTPUT"
          fi

  backend-fast:
    name: Backend fast suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend fast suite
        run: >-
          python3 -m pytest tests/
          -m "not requires_db and not requires_browser and not live_provider"
          --ignore=tests/test_agency.py
          --ignore=tests/test_agency_api.py
          --ignore=tests/test_chat_api_routes.py
          --ignore=tests/test_chat_websocket.py
          --ignore=tests/test_cortex_palette.py
          --ignore=tests/test_cycles_service.py
          --ignore=tests/test_multiplayer_cortex.py
          --ignore=tests/test_notifications_api.py
          --ignore=tests/test_theme_and_workspace_app_design_contracts.py
          -q

  backend-review:
    name: Backend review-fix suites
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run focused review-fix suites
        run: >-
          python3 -m pytest
          tests/test_api_ws.py
          tests/test_ws_manager.py
          tests/test_run_events.py
          tests/test_api_main.py
          tests/test_browser_sessions.py
          tests/test_ws_auth.py
          tests/test_scheduler.py
          tests/test_alembic_config.py
          tests/test_tool_policy.py
          tests/test_agent_run_runtime.py
          -q

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run Svelte check
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  db-contract:
    name: DB migration contract
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: illo_test
          POSTGRES_USER: illo_test
          POSTGRES_PASSWORD: illo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U illo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: illo_test
      DB_USER: illo_test
      DB_PASSWORD: illo_test
      TEST_DB_URL: postgresql://illo_test:illo_test@127.0.0.1:5433/illo_test
      CI_BRAIN_DB: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run database migrations
        run: python3 -m alembic upgrade head

      - name: Run schema contract tests
        run: python3 -m pytest tests/test_schema_contract.py -v --tb=short

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-fast
      - backend-review
      - frontend
      - db-contract
    if: always()

    steps:
      - name: Check selected CI jobs
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.backend-fast.result }}" \
            "${{ needs.backend-review.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.db-contract.result }}"
          do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A selected CI job failed or was cancelled."
              exit 1
            fi
          done
          echo "Selected CI jobs passed."
