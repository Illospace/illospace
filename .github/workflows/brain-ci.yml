name: Brain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  survivability:
    name: Capability survivability report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Measure impacted survivability
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: make survivability-pr

  backend-fast:
    name: Backend fast suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend fast suite
        run: make test-fast

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend unit tests, check, and build
        run: make test-frontend

      - name: Run frontend product journeys
        run: make test-frontend-e2e

  db-contract:
    name: DB migration contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: illo_test
          POSTGRES_USER: illo_test
          POSTGRES_PASSWORD: illo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U illo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: illo_test
      DB_USER: illo_test
      DB_PASSWORD: illo_test
      TEST_DB_URL: postgresql://illo_test:illo_test@127.0.0.1:5433/illo_test
      CI_BRAIN_DB: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run database migrations
        run: python3 -m alembic upgrade head

      - name: Run schema contract tests
        run: python3 -m pytest tests/test_schema_contract.py

      - name: Run core product journeys
        run: python3 -m pytest tests/test_core_product_journeys.py
