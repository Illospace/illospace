name: ${COMPOSE_PROJECT_NAME:-illospace}

x-illo-env: &illo-env
  ILLO_ENV: production
  ILLO_VALIDATE_MIGRATIONS: "1"
  ILLO_ALLOW_LOCAL_CODEX_AUTH_FALLBACK: "0"
  ILLO_OPENAI_OAUTH_LOCAL_BRIDGE: ${ILLO_OPENAI_OAUTH_LOCAL_BRIDGE:-0}
  ILLO_OPENAI_OAUTH_SERVER_CALLBACK: ${ILLO_OPENAI_OAUTH_SERVER_CALLBACK:-1}
  ILLO_PUBLIC_URL: ${ILLO_PUBLIC_URL:?Set ILLO_PUBLIC_URL in deploy/compose/.env}
  ILLO_DASHBOARD_URL: ${ILLO_PUBLIC_URL:?Set ILLO_PUBLIC_URL in deploy/compose/.env}
  SECRET_KEY: ${SECRET_KEY:?Run ./illo deploy init}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?Run ./illo deploy init}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?Set DB_NAME in deploy/compose/.env}
  DB_USER: ${DB_USER:?Set DB_USER in deploy/compose/.env}
  DB_PASSWORD: ${DB_PASSWORD:?Run ./illo deploy init}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_POOL_OVERFLOW: ${DB_POOL_OVERFLOW:-0}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  SCHEDULER_FAILURE_ALERT_THRESHOLD: ${SCHEDULER_FAILURE_ALERT_THRESHOLD:-3}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-api}
  EMBEDDING_API_PROVIDER: ${EMBEDDING_API_PROVIDER:-gemini}
  EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-gemini-embedding-2}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  WORKSPACE_ROOT: /workspaces
  ILLO_PRIVATE_HOME: /data/private
  JOURNAL_DIR: /data/private/journal
  AGENT_CONTEXT_DIR: /data/private/agent-context
  AGENT_CHECKLIST_PATH: /data/private/agent-context/pre-flight-checklist.md
  BRAIN_LOG_DIR: /data/private/logs
  CORTEX_EVENT_FANOUT_ENABLED: "1"
  ILLO_SELF_UPDATE_REQUEST_FILE: /data/private/self-update/request.json
  ILLO_SELF_UPDATE_STATUS_FILE: /data/private/self-update/status.json
  ILLO_SELF_UPDATE_HEARTBEAT_FILE: /data/private/self-update/heartbeat.json
  ILLO_SELF_UPDATE_LOG_PATH: /data/private/logs/illo-self-update.log
  ILLO_RUNTIME_SERVICES_REQUEST_FILE: /data/private/runtime-services/request.json
  ILLO_RUNTIME_SERVICES_STATUS_FILE: /data/private/runtime-services/status.json
  ILLO_RUNTIME_SERVICES_HEARTBEAT_FILE: /data/private/runtime-services/heartbeat.json
  ILLO_RUNTIME_SERVICES_LOG_PATH: /data/private/logs/illo-runtime-services.log
  ILLO_WORKSPACE_TOOLS_ROOT: /data/private/workspace-tools
  ILLO_WORKSPACE_TOOLS_REQUEST_FILE: /data/private/workspace-tools/request.json
  ILLO_WORKSPACE_TOOLS_STATUS_FILE: /data/private/workspace-tools/status.json
  ILLO_WORKSPACE_TOOLS_HEARTBEAT_FILE: /data/private/workspace-tools/heartbeat.json
  ILLO_WORKSPACE_TOOLS_LOG_PATH: /data/private/logs/illo-workspace-tools.log
  # Lifecycle activation (specs/illo-lifecycle): assignment rules, unclaimed
  # pool, and GitHub webhook ingress. Empty default = feature off.
  ILLO_BUSINESS_OWNER_USER_ID: ${ILLO_BUSINESS_OWNER_USER_ID:-}
  ILLO_PRODUCT_OWNER_USER_ID: ${ILLO_PRODUCT_OWNER_USER_ID:-}
  ILLO_REPO_OWNERS: ${ILLO_REPO_OWNERS:-}
  ILLO_UNCLAIMED_POOL_USER_ID: ${ILLO_UNCLAIMED_POOL_USER_ID:-}
  # Handoff packets (specs/illo-handoff-packets): per-member launch targets.
  # Empty default = codex for everyone (mint.py's config-with-default).
  ILLO_MEMBER_AGENT_TARGETS: ${ILLO_MEMBER_AGENT_TARGETS:-}
  ILLO_GITHUB_WEBHOOK_SECRET: ${ILLO_GITHUB_WEBHOOK_SECRET:-}
  ILLO_GITHUB_CONNECTION_ID: ${ILLO_GITHUB_CONNECTION_ID:-}
  # Slice 5 deploy-state: watched repos arm the promotion sweep, ladder
  # fields, and check_fix_deploy_state tool. Empty default = feature off.
  ILLO_DEPLOY_SWEEP_REPOS: ${ILLO_DEPLOY_SWEEP_REPOS:-}
  ILLO_DEPLOY_SETTLE_MINUTES: ${ILLO_DEPLOY_SETTLE_MINUTES:-}
  ILLO_DEPLOY_QUIET_HOURS: ${ILLO_DEPLOY_QUIET_HOURS:-}

x-backend-service: &backend-service
  image: ${ILLO_API_IMAGE:-ghcr.io/illospace/api:latest}
  build:
    context: ../..
    dockerfile: deploy/docker/api.Dockerfile
  restart: unless-stopped
  environment:
    <<: *illo-env
  volumes:
    - illo_private:/data/private
    - illo_uploads:/app/brain/uploads
    - illo_workspaces:/workspaces
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT_MS:-1000}
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in deploy/compose/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in deploy/compose/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./illo deploy init}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "brain.app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${ILLO_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["python", "-m", "brain.systems.cortex.worker"]
    stop_grace_period: 24h
    environment:
      <<: *illo-env
      CORTEX_MAX_CONCURRENT: ${CORTEX_MAX_CONCURRENT:-10}
      CORTEX_MAX_RUNTIME: ${CORTEX_MAX_RUNTIME:-600}
      CORTEX_EMBEDDING_READY_TIMEOUT_SECONDS: ${CORTEX_EMBEDDING_READY_TIMEOUT_SECONDS:-300}
      ILLO_AGENT_RUNNER_DRAIN_TIMEOUT_SECONDS: ${ILLO_AGENT_RUNNER_DRAIN_TIMEOUT_SECONDS:-infinity}
      ILLO_AGENT_RUNNER_TEARDOWN_TIMEOUT_SECONDS: ${ILLO_AGENT_RUNNER_TEARDOWN_TIMEOUT_SECONDS:-10}
      ILLO_DB_NULLPOOL: "1"
      ILLO_WORKER_ENABLE_CYCLE_SCHEDULER: "1"
      ILLO_WORKER_DISABLE_CYCLE_SCHEDULER: "0"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-service
    command:
      - python
      - -m
      - brain.app.cli.scheduler
      - daemon
      - --owner-mode
      - scheduler
      - --poll-interval-seconds
      - "15"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  slack-connector:
    <<: *backend-service
    profiles: ["slack"]
    command: ["python", "-m", "brain.app.cli.slack_connector"]
    environment:
      <<: *illo-env
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      ILLO_SLACK_ORG_ID: ${ILLO_SLACK_ORG_ID:-}
      ILLO_SLACK_OWNER_USER_ID: ${ILLO_SLACK_OWNER_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  updater:
    image: ${ILLO_UPDATER_IMAGE:-ghcr.io/illospace/updater:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/updater.Dockerfile
    command: ["bash", "/repo/deploy/scripts/self-update-daemon.sh"]
    restart: unless-stopped
    environment:
      ILLO_SELF_UPDATE_REPO: /repo
      ILLO_SELF_UPDATE_REQUEST_FILE: /data/private/self-update/request.json
      ILLO_SELF_UPDATE_STATUS_FILE: /data/private/self-update/status.json
      ILLO_SELF_UPDATE_HEARTBEAT_FILE: /data/private/self-update/heartbeat.json
      ILLO_SELF_UPDATE_LOG_PATH: /data/private/logs/illo-self-update.log
      ILLO_RUNTIME_SERVICES_REQUEST_FILE: /data/private/runtime-services/request.json
      ILLO_RUNTIME_SERVICES_STATUS_FILE: /data/private/runtime-services/status.json
      ILLO_RUNTIME_SERVICES_HEARTBEAT_FILE: /data/private/runtime-services/heartbeat.json
      ILLO_RUNTIME_SERVICES_LOG_PATH: /data/private/logs/illo-runtime-services.log
      ILLO_WORKSPACE_TOOLS_ROOT: /data/private/workspace-tools
      ILLO_WORKSPACE_TOOLS_REQUEST_FILE: /data/private/workspace-tools/request.json
      ILLO_WORKSPACE_TOOLS_STATUS_FILE: /data/private/workspace-tools/status.json
      ILLO_WORKSPACE_TOOLS_HEARTBEAT_FILE: /data/private/workspace-tools/heartbeat.json
      ILLO_WORKSPACE_TOOLS_LOG_PATH: /data/private/logs/illo-workspace-tools.log
      ILLO_COMPOSE_ENV_FILE: /repo/deploy/compose/.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-illospace}
    volumes:
      - illo_private:/data/private
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo
    healthcheck:
      test: ["CMD", "illo-self-update-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    image: ${ILLO_WEB_IMAGE:-ghcr.io/illospace/web:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ILLO_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  illo_private:
  illo_uploads:
  illo_workspaces:
