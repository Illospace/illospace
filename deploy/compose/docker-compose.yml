name: ${COMPOSE_PROJECT_NAME:-illospace}

x-illo-env: &illo-env
  ILLO_ENV: production
  ILLO_VALIDATE_MIGRATIONS: "1"
  ILLO_ALLOW_LOCAL_CODEX_AUTH_FALLBACK: "0"
  ILLO_OPENAI_OAUTH_LOCAL_BRIDGE: ${ILLO_OPENAI_OAUTH_LOCAL_BRIDGE:-0}
  ILLO_OPENAI_OAUTH_SERVER_CALLBACK: ${ILLO_OPENAI_OAUTH_SERVER_CALLBACK:-1}
  ILLO_PUBLIC_URL: ${ILLO_PUBLIC_URL:?Set ILLO_PUBLIC_URL in deploy/compose/.env}
  ILLO_DASHBOARD_URL: ${ILLO_PUBLIC_URL:?Set ILLO_PUBLIC_URL in deploy/compose/.env}
  SECRET_KEY: ${SECRET_KEY:?Run ./illo deploy init}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?Run ./illo deploy init}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?Set DB_NAME in deploy/compose/.env}
  DB_USER: ${DB_USER:?Set DB_USER in deploy/compose/.env}
  DB_PASSWORD: ${DB_PASSWORD:?Run ./illo deploy init}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-api}
  EMBEDDING_API_PROVIDER: ${EMBEDDING_API_PROVIDER:-gemini}
  EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-gemini-embedding-2}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  WORKSPACE_ROOT: /workspaces
  ILLO_PRIVATE_HOME: /data/private
  JOURNAL_DIR: /data/private/journal
  AGENT_CONTEXT_DIR: /data/private/agent-context
  AGENT_CHECKLIST_PATH: /data/private/agent-context/pre-flight-checklist.md
  BRAIN_LOG_DIR: /data/private/logs
  CORTEX_EVENT_FANOUT_ENABLED: "1"

x-backend-service: &backend-service
  image: ${ILLO_API_IMAGE:-ghcr.io/illospace/api:latest}
  build:
    context: ../..
    dockerfile: deploy/docker/api.Dockerfile
  restart: unless-stopped
  environment:
    <<: *illo-env
  volumes:
    - illo_private:/data/private
    - illo_uploads:/app/brain/uploads
    - illo_workspaces:/workspaces
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in deploy/compose/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in deploy/compose/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./illo deploy init}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "brain.app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${ILLO_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["python", "-m", "brain.systems.cortex.worker"]
    stop_grace_period: 24h
    environment:
      <<: *illo-env
      CORTEX_MAX_CONCURRENT: ${CORTEX_MAX_CONCURRENT:-10}
      CORTEX_MAX_RUNTIME: ${CORTEX_MAX_RUNTIME:-600}
      CORTEX_EMBEDDING_READY_TIMEOUT_SECONDS: ${CORTEX_EMBEDDING_READY_TIMEOUT_SECONDS:-300}
      ILLO_AGENT_RUNNER_DRAIN_TIMEOUT_SECONDS: ${ILLO_AGENT_RUNNER_DRAIN_TIMEOUT_SECONDS:-infinity}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-service
    command:
      - python
      - -m
      - brain.app.cli.scheduler
      - daemon
      - --owner-mode
      - scheduler
      - --poll-interval-seconds
      - "15"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${ILLO_WEB_IMAGE:-ghcr.io/illospace/web:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ILLO_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  illo_private:
  illo_uploads:
  illo_workspaces:
