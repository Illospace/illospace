display_information:
  name: Illo
  description: One assistant for the whole team
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Illo
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - chat:write
      - reactions:read
      - reactions:write
      - files:read
      - users:read
      - users:read.email
      - incoming-webhook
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
