# Alembic configuration — illo-brain
# DB URL is built dynamically in env.py from brain.kernel.config; the placeholder
# below is never used at runtime.

[alembic]
script_location = brain/platform/db/alembic
# Allow the plain `alembic` entrypoint to import the local `brain` package.
prepend_sys_path = .
# Dummy — overridden in env.py
sqlalchemy.url = postgresql://localhost/illo_memory

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
