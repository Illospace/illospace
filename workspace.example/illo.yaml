team_name: Acme
timezone: Europe/Paris
default_owner: ada
slack:
  channels:
    - name: team
      id: C_ACME_TEAM
      mode: listen
      rule_files: [rules/team.md]
    - name: alerts
      id: C_ACME_ALERTS
      mode: coordinator
      rule_files: [rules/team.md, rules/alerts-coordinator.md]
github:
  repositories: [acme-example/engine]
digest:
  schedule: '0 9 * * 1-5'
  destination: person:ada
  # personal: needs  # Send a DM only when work waits or a fault exists.
  # team:
  #   channel: team  # Use a team-visible channel name from slack.channels.
  #   schedule: '0 9 * * 1-5'  # Use the team time zone.
stale_minutes:
  t3: 30
  claude-code: 30
  codex: 30
  github: 1440
  manual: 1440
  email: 1440
brain:
  # person_credential: team  # Needs auth: chatgpt and an active team_credential.
  runtime: claude
  model: default
  max_turns: 12
  timeout_s: 120
run_limits:
  max_concurrent: 4
  max_message_chars: 20000
