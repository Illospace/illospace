team_name: Acme
timezone: Europe/Paris
default_owner: ada
slack:
  # Add Illo to a channel in Slack, then mention it. No channel entry is required.
  default_mode: listen  # Use off to accept only listed channels.
  default_rule_files: []  # Rule files for channels with no entry.
  # List a channel for coordinator mode, its own rules, or mode: off.
  channels:
    - name: team
      id: C_ACME_TEAM
      mode: listen
      # team_members_only: true  # Accept a Slack-private channel whose humans are exactly the team.
      rule_files: [rules/team.md]
    - name: alerts
      id: C_ACME_ALERTS
      mode: coordinator
      rule_files: [rules/team.md, rules/alerts-coordinator.md]
github:
  task_list: bugs
  repositories: [acme-example/engine]
digest:
  schedule: '0 9 * * 1-5'
  destination: person:ada
  # personal: needs  # Send a DM only when work waits or a fault exists.
  # team:
  #   channel: team  # Use a team-visible member channel name or ID.
  #   schedule: '0 9 * * 1-5'  # Use the team time zone.
stale_minutes:
  t3: 30
  claude-code: 30
  codex: 30
  github: 1440
  manual: 1440
  email: 1440
brain:
  # person_credential: team  # Needs auth: chatgpt and an active team_credential.
  runtime: claude
  model: default
  max_turns: 12
  timeout_s: 120
run_limits:
  max_concurrent: 4
  max_message_chars: 20000

# triage:
#   auto_assign:
#     slack_bots: []  # Trusted monitor bot_id values from Slack.
#     signal_sources: []  # Trusted machine signal source names.
#   max_per_hour: 6  # Automatic assignments per hour, from 1 to 100.

tasks:
  release_max: 2
  check_minutes: 5
  reminder_window: [8, 20]
  github_writes_per_hour: 30
