team_name: Acme
timezone: Europe/Paris
default_owner: ada
slack:
  # Add Illo to a channel in Slack, then mention it. No channel entry is required.
  default_mode: listen  # Use off to accept only listed channels.
  default_rule_files: []  # Rule files for channels with no entry.
  # List a channel for coordinator mode, its own rules, or mode: off.
  channels:
    - name: team
      id: C_ACME_TEAM
      mode: listen
      # team_members_only: true  # Accept a Slack-private channel whose humans are exactly the team.
      rule_files: [rules/team.md]
    - name: alerts
      id: C_ACME_ALERTS
      mode: coordinator
      rule_files: [rules/team.md, rules/alerts-coordinator.md]
github:
  repositories: [acme-example/engine]
digest:
  schedule: '0 9 * * 1-5'
  destination: person:ada
  # personal: needs  # Send a DM only when work waits or a fault exists.
  # team:
  #   channel: team  # Use a team-visible member channel name or ID.
  #   schedule: '0 9 * * 1-5'  # Use the team time zone.
stale_minutes:
  t3: 30
  claude-code: 30
  codex: 30
  github: 1440
  manual: 1440
  email: 1440
brain:
  # Each run kind has a route: person_dm, team_channel, tainted, routine, digest,
  # agent_request, board_coordinator, deep. Omitted fields come from default.
  # The brain service owns the providers and their keys. See deploy/brain.env.example.
  routes:
    default: {provider: chatgpt, model: gpt-6.2-sol, effort: low, max_tool_calls: 12, timeout_s: 120}
    person_dm: {effort: medium}
    # To use Gemini for direct messages, replace the person_dm line above.
    # person_dm: {provider: gemini, model: gemini-4-neon, effort: minimal}
    team_channel: {effort: medium}
    agent_request: {effort: medium}
    deep: {effort: high, max_tool_calls: 80, timeout_s: 1200, max_output_tokens: 16000}
  # Who pays for a run on the chatgpt provider.
  chatgpt:
    team_credential: ada  # The ChatGPT grant of this person pays for team runs.
    # person_credential: own  # own: each person pays for their own requests. team: ada pays for all.
    # tainted_credential: none  # none, team, or api_key (needs fallback).
    # allowed_accounts: []  # Other ChatGPT account emails that a person can connect.
    # fallback: none  # Or an API-key provider, for example openai.
  # transcription: {provider: openai, model: gpt-4o-mini-transcribe}  # For voice.transcription: brain.
run_limits:
  max_concurrent: 4
  max_message_chars: 20000

# triage:
#   auto_assign:
#     slack_bots: []  # Trusted monitor bot_id values from Slack.
#     signal_sources: []  # Trusted machine signal source names.
#   max_per_hour: 6  # Automatic assignments per hour, from 1 to 100.

tasks:
  wait_check: true
  recheck_days: 3
  release_max: 2
  check_minutes: 5
  reminder_window: [8, 20]
  github_writes_per_hour: 30

# Task pages are off by default. Expose /t/ and /web/ to use them.
# pages:
#   enabled: false
#   url: https://illo.example.com
